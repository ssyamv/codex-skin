name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Node runtime and tests
        run: npm run verify
      - name: Verify Swift dynamic theme model
        run: npm run test:swift
      - name: Validate distributable Skill contract
        run: npm run validate:skill
      - name: Build ad-hoc signed App
        run: npm run build:app
      - name: Exercise release packager
        run: |
          npm run test:release
          ./scripts/package-release.zsh \
            --app "dist/Codex Skin Studio.app" \
            --skill .agents/skills/customize-codex-theme \
            --version 1.8.0 \
            --arch arm64 \
            --output dist/ci-release
